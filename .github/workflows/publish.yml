name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - pyproject.toml
      - src/**
      - tests/**

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python -m pip install packaging

      - name: Check whether this version is unpublished
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.request

          from packaging.version import Version

          with open("pyproject.toml", "rb") as project_file:
              current = Version(tomllib.load(project_file)["project"]["version"])
          with urllib.request.urlopen(
              "https://pypi.org/pypi/hvbrowser/json",
              timeout=30,
          ) as response:
              published = Version(json.load(response)["info"]["version"])

          if current < published:
              raise SystemExit(
                  f"Project version {current} is older than published version {published}"
              )

          print(f"current={current}")
          print(f"published={published}")
          print(f"publish={'true' if current > published else 'false'}")
          PY

      - name: Build distributions
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade build check-wheel-contents twine
          python -m build
          python -m twine check dist/*
          check-wheel-contents dist/*.whl

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
