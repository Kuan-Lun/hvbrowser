[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hvbrowser"
version = "0.10.0"
description = "Browser automation APIs for HentaiVerse."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "hbrowser>=0.44.0,<0.45",
    # hvbrowser imports zendriver.cdp directly; keep this exact runtime cohort
    # aligned with hbrowser's verified Zendriver constraint.
    "zendriver==0.16.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hvbrowser"
Tracker = "https://github.com/Kuan-Lun/hvbrowser/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hvbrowser"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/scripts/live_readonly_smoke.py",
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
# Traditional Chinese prose legitimately uses full-width punctuation. SIM
# rewrites are advisory and can obscure lifecycle/safety sequencing whose
# lexical order is audited. B904 is excluded because re-raising the exact
# original exception identity and traceback is a tested lifecycle contract.
ignore = ["B904", "RUF001", "RUF002", "RUF003", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src/hvbrowser", "scripts/live_readonly_smoke.py"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.h2h.version]
release-paths = ["LICENSE", "src/**"]
