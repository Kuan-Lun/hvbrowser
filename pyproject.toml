[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hvbrowser"
version = "0.7.2"
description = "Browser automation APIs for HentaiVerse."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = ["hbrowser>=0.40.1,<0.41"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hvbrowser"
Tracker = "https://github.com/Kuan-Lun/hvbrowser/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hvbrowser"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/scripts/live_readonly_smoke.py",
    "/src",
    "/tests",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
extend-ignore = ["E203", "E226", "E501"]
